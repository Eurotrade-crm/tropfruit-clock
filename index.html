<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tropfruit Money Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --tile-dark: #2c2c30;
    --tile-darker: #1d1d20;
    --tile-light: #3b3b40;
    --seam: rgba(0,0,0,0.55);
    --panel-bg: rgba(255, 251, 240, 0.94);
    --ink: #2E3B2A;
    --ink-muted: #6C7A63;
    --amber: #D98A2B;
    --line: #E3D9BE;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'IBM Plex Sans', sans-serif;
    color: var(--ink);
  }

  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
  }

  body {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 18px;
  }

  .panel {
    position: relative;
    width: 100%;
    max-width: 760px;
    text-align: center;
    background: var(--panel-bg);
    border-radius: 18px;
    padding: 40px 28px 32px;
    box-shadow: 0 24px 60px rgba(40, 30, 10, 0.28), 0 2px 0 rgba(255,255,255,0.6) inset;
    overflow: hidden;
  }

  .panel > * { position: relative; z-index: 1; }

  .label {
    width: 50%;
    margin: 0 auto 26px;
    font-size: clamp(0.95rem, 4vw, 1.65rem);
    font-weight: 600;
    font-variant: small-caps;
    letter-spacing: 0.03em;
    color: var(--amber);
    white-space: nowrap;
  }

  .clock-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(4px, 0.9vw, 8px);
    flex-wrap: wrap;
  }

  .group-gap {
    width: clamp(10px, 3vw, 22px);
    flex-shrink: 0;
  }

  .currency-tag {
    margin-left: clamp(8px, 2vw, 16px);
    align-self: center;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: clamp(0.85rem, 2.4vw, 1.15rem);
    color: var(--amber);
    letter-spacing: 0.06em;
    border: 1.5px solid var(--amber);
    border-radius: 6px;
    padding: 4px 8px;
  }

  .rotor {
    --h: clamp(2.6rem, 9vw, 4.4rem);
    --w: calc(var(--h) * 0.68);
    position: relative;
    width: var(--w);
    height: var(--h);
    border-radius: calc(var(--h) * 0.12);
    overflow: hidden;
    box-shadow: 0 6px 14px rgba(0,0,0,0.35);
    perspective: calc(var(--h) * 4);
    flex-shrink: 0;
  }

  .rotor .face {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    overflow: hidden;
    backface-visibility: hidden;
  }

  .rotor .top { top: 0; background: linear-gradient(to bottom, var(--tile-light), var(--tile-dark)); }
  .rotor .bottom { bottom: 0; background: linear-gradient(to bottom, var(--tile-darker), #141416); }

  .rotor .num {
    position: absolute;
    left: 0;
    width: 100%;
    height: var(--h);
    text-align: center;
    line-height: var(--h);
    font-family: 'Archivo Black', sans-serif;
    font-size: calc(var(--h) * 0.72);
    color: #F5F3EC;
  }

  .rotor .top .num { top: 0; }
  .rotor .bottom .num { top: calc(var(--h) * -0.5); }

  .rotor .seam {
    position: absolute;
    top: calc(50% - 1px);
    left: 0;
    width: 100%;
    height: 2px;
    background: var(--seam);
    z-index: 5;
  }

  .rotor .leaf-front,
  .rotor .leaf-rear {
    z-index: 3;
    transform-style: preserve-3d;
  }

  .rotor .leaf-front { top: 0; transform-origin: bottom; background: linear-gradient(to bottom, var(--tile-light), var(--tile-dark)); }
  .rotor .leaf-rear { bottom: 0; transform-origin: top; background: linear-gradient(to bottom, var(--tile-darker), #141416); transform: rotateX(90deg); }

  .rotor.flipping .leaf-front { animation: flipFront 0.55s ease-in forwards; }
  .rotor.flipping .leaf-rear { animation: flipRear 0.55s ease-out forwards; animation-delay: 0.27s; }

  @keyframes flipFront {
    0%   { transform: rotateX(0deg); }
    100% { transform: rotateX(-90deg); }
  }
  @keyframes flipRear {
    0%   { transform: rotateX(90deg); }
    100% { transform: rotateX(0deg); }
  }

  .rule {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line), transparent);
    margin: 32px 0 26px;
  }

  .breakdown {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0;
  }

  .breakdown div { padding: 0 4px; border-left: 1px solid var(--line); }
  .breakdown div:first-child { border-left: none; }

  .breakdown .period {
    font-size: clamp(0.5rem, 1.3vw, 0.62rem);
    color: var(--ink-muted);
    margin-bottom: 4px;
    white-space: nowrap;
  }

  .breakdown .value {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: clamp(0.52rem, 1.5vw, 0.78rem);
    color: var(--amber);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .breakdown .value .grp-gap {
    display: inline-block;
    width: 0.25em;
  }
</style>
</head>
<body>

<svg id="bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice"></svg>

<div class="panel">
  <div class="label">Tropfruit money clock</div>

  <div class="clock-row" id="clockRow"></div>

  <div class="rule"></div>

  <div class="breakdown">
    <div>
      <div class="period">Last hour</div>
      <div class="value" id="hour">+0 USD</div>
    </div>
    <div>
      <div class="period">Last day</div>
      <div class="value" id="day">+0 USD</div>
    </div>
    <div>
      <div class="period">Last 7 days</div>
      <div class="value" id="week">+0 USD</div>
    </div>
    <div>
      <div class="period">Last 30 days</div>
      <div class="value" id="month">+0 USD</div>
    </div>
    <div>
      <div class="period">Last 90 days</div>
      <div class="value" id="quarter">+0 USD</div>
    </div>
  </div>
</div>

<script>
  /* ---------- Fond : plantation d'agrumes ---------- */
  (function drawOrchard() {
    const svg = document.getElementById('bg');
    const NS = 'http://www.w3.org/2000/svg';

    function seeded(seed) {
      let t = seed;
      return function () { t = (t * 9301 + 49297) % 233280; return t / 233280; };
    }
    const rand = seeded(42);

    function el(tag, attrs) {
      const e = document.createElementNS(NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }

    const defs = el('defs', {});
    const skyGrad = el('linearGradient', { id: 'sky', x1: '0', y1: '0', x2: '0', y2: '1' });
    skyGrad.appendChild(el('stop', { offset: '0%', 'stop-color': '#FCEBC0' }));
    skyGrad.appendChild(el('stop', { offset: '55%', 'stop-color': '#F6DE9C' }));
    skyGrad.appendChild(el('stop', { offset: '100%', 'stop-color': '#E7D390' }));
    defs.appendChild(skyGrad);

    const groundGrad = el('linearGradient', { id: 'ground', x1: '0', y1: '0', x2: '0', y2: '1' });
    groundGrad.appendChild(el('stop', { offset: '0%', 'stop-color': '#CDA45C' }));
    groundGrad.appendChild(el('stop', { offset: '100%', 'stop-color': '#A9793E' }));
    defs.appendChild(groundGrad);

    const sunGrad = el('radialGradient', { id: 'sun', cx: '50%', cy: '50%', r: '50%' });
    sunGrad.appendChild(el('stop', { offset: '0%', 'stop-color': '#FFF4D6', 'stop-opacity': '0.9' }));
    sunGrad.appendChild(el('stop', { offset: '100%', 'stop-color': '#FFF4D6', 'stop-opacity': '0' }));
    defs.appendChild(sunGrad);

    const brush = el('filter', { id: 'brush', x: '-40%', y: '-40%', width: '180%', height: '180%' });
    const turb = el('feTurbulence', { type: 'fractalNoise', baseFrequency: '0.9', numOctaves: '2', seed: '7', result: 'noise' });
    const disp = el('feDisplacementMap', { in: 'SourceGraphic', in2: 'noise', scale: '6' });
    brush.appendChild(turb);
    brush.appendChild(disp);
    defs.appendChild(brush);

    function drawPaintedSun(cx, cy, r) {
      const sun = el('g', { filter: 'url(#brush)' });

      // halo doux
      svg.appendChild(el('circle', { cx, cy, r: r * 2.3, fill: 'url(#sun)' }));

      // rayons façon coups de pinceau
      const rayCount = 16;
      for (let i = 0; i < rayCount; i++) {
        const angle = (i / rayCount) * Math.PI * 2 + rand() * 0.05;
        const len = r * (0.85 + rand() * 0.5);
        const baseW = r * (0.12 + rand() * 0.05);
        const baseR = r * 0.98;
        const dx = Math.cos(angle), dy = Math.sin(angle);
        const px = -dy, py = dx;
        const bx = cx + dx * baseR, by = cy + dy * baseR;
        const tx = cx + dx * (baseR + len), ty = cy + dy * (baseR + len);
        const p1x = bx + px * baseW, p1y = by + py * baseW;
        const p2x = bx - px * baseW, p2y = by - py * baseW;
        const color = i % 2 === 0 ? '#F5A623' : '#FBC531';
        const path = el('path', {
          d: `M ${p1x} ${p1y} Q ${tx + px * baseW * 0.2} ${ty + py * baseW * 0.2} ${tx} ${ty} Q ${tx - px * baseW * 0.2} ${ty - py * baseW * 0.2} ${p2x} ${p2y} Z`,
          fill: color
        });
        sun.appendChild(path);
      }

      // coeur en spirale (deux rubans entrelacés)
      function spiralPath(phase, turns, r0, r1) {
        const steps = 90;
        let d = '';
        for (let s = 0; s <= steps; s++) {
          const t = s / steps;
          const theta = t * turns * Math.PI * 2 + phase;
          const rr = r0 + (r1 - r0) * t;
          const x = cx + Math.cos(theta) * rr;
          const y = cy + Math.sin(theta) * rr;
          d += (s === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
        }
        return d;
      }

      sun.appendChild(el('circle', { cx, cy, r: r * 0.98, fill: '#F7A61E' }));
      sun.appendChild(el('path', {
        d: spiralPath(0, 2.1, r * 0.94, r * 0.06),
        fill: 'none', stroke: '#FBC531', 'stroke-width': r * 0.24, 'stroke-linecap': 'round'
      }));
      sun.appendChild(el('path', {
        d: spiralPath(Math.PI, 2.1, r * 0.94, r * 0.06),
        fill: 'none', stroke: '#FFE9A8', 'stroke-width': r * 0.16, 'stroke-linecap': 'round'
      }));

      svg.appendChild(sun);
    }

    svg.appendChild(defs);
    svg.appendChild(el('rect', { x: 0, y: 0, width: 1600, height: 900, fill: 'url(#sky)' }));
    drawPaintedSun(220, 470, 150);

    // collines lointaines
    svg.appendChild(el('ellipse', { cx: 300, cy: 560, rx: 620, ry: 90, fill: '#B7C77E', opacity: 0.55 }));
    svg.appendChild(el('ellipse', { cx: 1250, cy: 580, rx: 700, ry: 100, fill: '#A9BE72', opacity: 0.5 }));

    svg.appendChild(el('rect', { x: 0, y: 540, width: 1600, height: 360, fill: 'url(#ground)' }));

    const trunkColor = '#6B4A30';
    const foliage = ['#4C7A3E', '#5B8B48', '#3F6B34'];
    const fruitColors = ['#E8871E', '#F2C230', '#EE9B2E'];

    function tree(x, y, scale, group) {
      const g = el('g', { transform: `translate(${x},${y}) scale(${scale})` });

      g.appendChild(el('ellipse', { cx: 0, cy: 6, rx: 34, ry: 8, fill: 'rgba(0,0,0,0.18)' }));
      g.appendChild(el('rect', { x: -4, y: -30, width: 8, height: 34, fill: trunkColor, rx: 2 }));

      const canopyPositions = [
        { dx: -16, dy: -46, r: 22 },
        { dx: 14, dy: -50, r: 24 },
        { dx: 0, dy: -64, r: 24 },
        { dx: -6, dy: -34, r: 20 }
      ];
      canopyPositions.forEach((c, i) => {
        g.appendChild(el('circle', {
          cx: c.dx, cy: c.dy, r: c.r,
          fill: foliage[(i + Math.floor(rand() * 3)) % foliage.length]
        }));
      });

      const fruitCount = 5 + Math.floor(rand() * 4);
      for (let i = 0; i < fruitCount; i++) {
        const ang = rand() * Math.PI * 2;
        const rad = 14 + rand() * 24;
        const fx = Math.cos(ang) * rad;
        const fy = -46 + Math.sin(ang) * rad * 0.8;
        g.appendChild(el('circle', {
          cx: fx, cy: fy, r: 2.6 + rand() * 1.6,
          fill: fruitColors[Math.floor(rand() * fruitColors.length)]
        }));
      }

      group.appendChild(g);
    }

    const rows = [
      { y: 600, scale: 0.55, count: 15 },
      { y: 670, scale: 0.72, count: 12 },
      { y: 750, scale: 0.95, count: 9 },
      { y: 840, scale: 1.25, count: 7 }
    ];

    rows.forEach(row => {
      const group = el('g', {});
      const step = 1700 / row.count;
      for (let i = 0; i < row.count; i++) {
        const x = -50 + i * step + (rand() - 0.5) * step * 0.4;
        const y = row.y + (rand() - 0.5) * 14;
        tree(x, y, row.scale, group);
      }
      svg.appendChild(group);
    });
  })();

  /* ---------- Calcul des intérêts ---------- */
  const PRINCIPAL = 2238730;
  const START = new Date('2024-02-16T00:00:00Z');

  const PERIODS = [
    { start: '2024-02-16', end: '2024-06-30', rate: 8.62 },
    { start: '2024-07-01', end: '2024-12-31', rate: 8.37 },
    { start: '2025-01-01', end: '2025-06-30', rate: 7.27 },
    { start: '2025-07-01', end: '2025-12-31', rate: 6.27 },
    { start: '2026-01-01', end: '2026-06-30', rate: 6.27 },
    { start: '2026-07-01', end: '2099-12-31', rate: 6.52 }
  ].map(p => ({
    start: new Date(p.start + 'T00:00:00Z'),
    end: new Date(p.end + 'T23:59:59Z'),
    rate: p.rate
  }));

  const MS_DAY = 24 * 60 * 60 * 1000;

  function accruedInterest(from, to) {
    if (to <= from) return 0;
    let total = 0;
    for (const p of PERIODS) {
      const segStart = new Date(Math.max(p.start.getTime(), from.getTime()));
      const segEnd = new Date(Math.min(p.end.getTime(), to.getTime()));
      if (segEnd <= segStart) continue;
      const days = (segEnd.getTime() - segStart.getTime()) / MS_DAY;
      total += PRINCIPAL * (p.rate / 100) * (days / 365);
    }
    return total;
  }

  function groupDigits(n) {
    const s = String(Math.round(n));
    const groups = [];
    let i = s.length;
    while (i > 3) { groups.unshift(s.slice(i - 3, i)); i -= 3; }
    groups.unshift(s.slice(0, i));
    return groups;
  }

  function fmtGroupedHTML(n) {
    return groupDigits(n)
      .map(g => `<span class="grp">${g}</span>`)
      .join('<span class="grp-gap"></span>');
  }

  /* ---------- Horloge à chiffres basculants ---------- */
  const clockRow = document.getElementById('clockRow');
  let tiles = [];
  let currentDigits = '';

  function buildClock(digitStr) {
    clockRow.innerHTML = '';
    tiles = [];
    const len = digitStr.length;

    for (let i = 0; i < len; i++) {
      const posFromRight = len - i;
      if (i > 0 && posFromRight % 3 === 0) {
        const gap = document.createElement('div');
        gap.className = 'group-gap';
        clockRow.appendChild(gap);
      }
      tiles.push(createTile(digitStr[i]));
    }

    const tag = document.createElement('div');
    tag.className = 'currency-tag';
    tag.textContent = 'USD';
    clockRow.appendChild(tag);

    currentDigits = digitStr;
  }

  function createTile(digit) {
    const rotor = document.createElement('div');
    rotor.className = 'rotor';

    const top = document.createElement('div');
    top.className = 'face top';
    const topNum = document.createElement('div');
    topNum.className = 'num';
    topNum.textContent = digit;
    top.appendChild(topNum);

    const bottom = document.createElement('div');
    bottom.className = 'face bottom';
    const bottomNum = document.createElement('div');
    bottomNum.className = 'num';
    bottomNum.textContent = digit;
    bottom.appendChild(bottomNum);

    const seam = document.createElement('div');
    seam.className = 'seam';

    const leafFront = document.createElement('div');
    leafFront.className = 'face leaf-front';
    const leafFrontNum = document.createElement('div');
    leafFrontNum.className = 'num';
    leafFrontNum.textContent = digit;
    leafFront.appendChild(leafFrontNum);

    const leafRear = document.createElement('div');
    leafRear.className = 'face leaf-rear';
    const leafRearNum = document.createElement('div');
    leafRearNum.className = 'num';
    leafRearNum.textContent = digit;
    leafRear.appendChild(leafRearNum);

    rotor.appendChild(top);
    rotor.appendChild(bottom);
    rotor.appendChild(leafFront);
    rotor.appendChild(leafRear);
    rotor.appendChild(seam);

    clockRow.insertBefore(rotor, null);

    rotor._refs = { top: topNum, bottom: bottomNum, leafFront: leafFrontNum, leafRear: leafRearNum, value: digit };
    return rotor;
  }

  function flipTile(rotor, newDigit) {
    const refs = rotor._refs;
    if (refs.value === newDigit) return;

    refs.top.textContent = newDigit;
    refs.leafFront.textContent = refs.value;
    refs.leafRear.textContent = newDigit;

    rotor.classList.remove('flipping');
    void rotor.offsetWidth; // force reflow to restart animation
    rotor.classList.add('flipping');

    setTimeout(() => {
      refs.bottom.textContent = newDigit;
      rotor.classList.remove('flipping');
      refs.leafFront.textContent = newDigit;
      refs.value = newDigit;
    }, 560);
  }

  function updateClock(valueInt) {
    const digitStr = String(valueInt);
    if (digitStr.length !== currentDigits.length) {
      buildClock(digitStr);
      return;
    }
    for (let i = 0; i < digitStr.length; i++) {
      if (digitStr[i] !== currentDigits[i]) {
        flipTile(tiles[i], digitStr[i]);
      }
    }
    currentDigits = digitStr;
  }

  const hourEl = document.getElementById('hour');
  const dayEl = document.getElementById('day');
  const weekEl = document.getElementById('week');
  const monthEl = document.getElementById('month');
  const quarterEl = document.getElementById('quarter');

  function tick() {
    const now = new Date();
    const interestToDate = accruedInterest(START, now);
    const totalValue = Math.round(PRINCIPAL + interestToDate);

    const hourAgo = new Date(now.getTime() - 60 * 60 * 1000);
    const dayAgo = new Date(now.getTime() - 1 * MS_DAY);
    const weekAgo = new Date(now.getTime() - 7 * MS_DAY);
    const monthAgo = new Date(now.getTime() - 30 * MS_DAY);
    const quarterAgo = new Date(now.getTime() - 90 * MS_DAY);

    const hourGain = accruedInterest(hourAgo > START ? hourAgo : START, now);
    const dayGain = accruedInterest(dayAgo > START ? dayAgo : START, now);
    const weekGain = accruedInterest(weekAgo > START ? weekAgo : START, now);
    const monthGain = accruedInterest(monthAgo > START ? monthAgo : START, now);
    const quarterGain = accruedInterest(quarterAgo > START ? quarterAgo : START, now);

    updateClock(totalValue);

    hourEl.innerHTML = '+' + fmtGroupedHTML(hourGain) + ' USD';
    dayEl.innerHTML = '+' + fmtGroupedHTML(dayGain) + ' USD';
    weekEl.innerHTML = '+' + fmtGroupedHTML(weekGain) + ' USD';
    monthEl.innerHTML = '+' + fmtGroupedHTML(monthGain) + ' USD';
    quarterEl.innerHTML = '+' + fmtGroupedHTML(quarterGain) + ' USD';

    requestAnimationFrame(tick);
  }

  buildClock(String(Math.round(PRINCIPAL + accruedInterest(START, new Date()))));
  requestAnimationFrame(tick);
</script>

</body>
</html>
